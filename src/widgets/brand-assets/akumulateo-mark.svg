<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none">
  <!-- Akumulateo – Sygnet Kwadratowy / Favicon / App Icon / Badge -->
  <defs>
    <linearGradient id="markAmberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="markBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#090D16" />
    </linearGradient>
    <filter id="markGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#F59E0B" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Zaokrąglone tło squircle -->
  <rect width="120" height="120" rx="28" fill="url(#markBgGrad)" stroke="#334155" stroke-width="2.5" />

  <!-- Bieguny akumulatora -->
  <rect x="32" y="16" width="16" height="10" rx="3" fill="#64748B" />
  <rect x="72" y="16" width="16" height="10" rx="3" fill="#EF4444" />
  <!-- Plus symbol -->
  <path d="M78 12h4M80 10v4" stroke="#EF4444" stroke-width="2" stroke-linecap="round" />

  <!-- Korpus akumulatora -->
  <rect x="22" y="24" width="76" height="74" rx="14" fill="#0F172A" stroke="#475569" stroke-width="2" />
  <line x1="22" y1="44" x2="98" y2="44" stroke="#1E293B" stroke-width="2" />
  <line x1="22" y1="78" x2="98" y2="78" stroke="#1E293B" stroke-width="2" />

  <!-- Dynamiczna błyskawica ratunkowa -->
  <path d="M64 30L44 60h13l-7 28 27-36H59l11-22z" fill="url(#markAmberGrad)" filter="url(#markGlow)" />

  <!-- Zielona dioda dyżuru 24h -->
  <circle cx="85" cy="85" r="4.5" fill="#10B981" />
  <circle cx="85" cy="85" r="7.5" stroke="#10B981" stroke-width="1.5" stroke-opacity="0.5" />
</svg>
