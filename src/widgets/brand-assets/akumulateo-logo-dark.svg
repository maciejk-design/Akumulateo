<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 90" width="100%" height="100%" fill="none">
  <!-- Akumulateo – Oficjalny Logotyp Horyzontalny (Dark Mode / On Dark Backgrounds) -->
  <defs>
    <linearGradient id="amberGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="batteryBodyDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#090D16" />
    </linearGradient>
    <filter id="glowDark" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#F59E0B" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Sygnet: Akumulator z Błyskawicą 12V -->
  <g transform="translate(10, 10)">
    <!-- Biegun ujemny (-) lewy -->
    <rect x="14" y="6" width="10" height="7" rx="2" fill="#94A3B8" />
    <!-- Biegun dodatni (+) prawy -->
    <rect x="44" y="6" width="10" height="7" rx="2" fill="#F87171" />
    <path d="M47 3h4M49 1v4" stroke="#F87171" stroke-width="1.5" stroke-linecap="round" />

    <!-- Korpus baterii -->
    <rect x="6" y="12" width="56" height="52" rx="10" fill="url(#batteryBodyDark)" stroke="#475569" stroke-width="1.8" />
    
    <!-- Paski zabezpieczające korpusu -->
    <line x1="6" y1="26" x2="62" y2="26" stroke="#334155" stroke-width="1.5" />
    <line x1="6" y1="50" x2="62" y2="50" stroke="#334155" stroke-width="1.5" />

    <!-- Centralna błyskawica dynamiczna -->
    <path d="M37 17L22 38h9l-5 19 19-24h-10l7-16z" fill="url(#amberGradDark)" filter="url(#glowDark)" />

    <!-- Dioda statusowa 24h -->
    <circle cx="53" cy="56" r="3" fill="#10B981" />
  </g>

  <!-- Typografia: AKUMULATEO (Biała z akcentem bursztynowym) -->
  <g transform="translate(85, 48)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Space Grotesk', 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" letter-spacing="1.5" fill="#FFFFFF">
      AKUMULAT<tspan fill="#F59E0B">E</tspan>O
    </text>
  </g>

  <!-- Sub-tytuł: POGOTOWIE AKUMULATOROWE 24H -->
  <g transform="translate(87, 68)">
    <circle cx="3" cy="5" r="3" fill="#10B981" />
    <text x="12" y="8" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" letter-spacing="2.8" fill="#94A3B8" text-transform="uppercase">
      POGOTOWIE AKUMULATOROWE 24H
    </text>
  </g>
</svg>
