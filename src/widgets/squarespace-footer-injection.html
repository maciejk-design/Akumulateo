<!-- 3. Skrypt śledzenia konwersji (GA4 + Google Ads) -->
<script>
  function akumulateoTrackPhoneClick(e) {
    try {
      if (typeof gtag === 'function') {
        gtag('event', 'phone_call_click', {
          event_category: 'Contact',
          event_label: '+48696556446',
          value: 100
        });

        gtag('event', 'conversion', {
          'send_to': 'AW-16941768870',
          'event_category': 'Phone Call',
          'event_label': 'Sticky Bar Click'
        });
      }

      if (typeof fbq === 'function') {
        fbq('track', 'Contact', { content_name: 'Sticky Call Bar 24h' });
      }
    } catch (err) {
      console.warn('Błąd śledzenia kliknięcia:', err);
    }
  }
</script>
