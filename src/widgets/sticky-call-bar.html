<!-- ========================================================
     AKUMULATEO - POGOTOWIE AKUMULATOROWE WARSZAWA 24H
     MOBILE STICKY CLICK-TO-CALL BAR FOR SQUARESPACE
     Wklej ten kod w: Settings -> Advanced -> Code Injection -> FOOTER
     ======================================================== -->

<style>
  /* Pasek widoczny wyłącznie na urządzeniach mobilnych (< 768px) */
  #akumulateo-sticky-bar {
    display: none;
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    background: #111111;
    border-top: 2px solid #f59e0b; /* Akcent ostrzegawczy / żółty */
    padding: 10px 14px calc(10px + env(safe-area-inset-bottom, 0px)) 14px;
    box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.45);
    z-index: 9999999;
    box-sizing: border-box;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  @media (max-width: 768px) {
    #akumulateo-sticky-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    /* Zapobiega zasłanianiu stopki przez pasek */
    body {
      padding-bottom: 74px !important;
    }
  }

  .akumulateo-bar-info {
    display: flex;
    flex-direction: column;
    color: #ffffff;
    line-height: 1.2;
  }

  .akumulateo-bar-status {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: #10b981; /* Zielony wskaźnik dostępności 24h */
    display: flex;
    align-items: center;
    gap: 5px;
    margin-bottom: 2px;
  }

  .akumulateo-pulse-dot {
    width: 7px;
    height: 7px;
    background-color: #10b981;
    border-radius: 50%;
    display: inline-block;
    box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7);
    animation: akumulateo-pulse 1.8s infinite;
  }

  @keyframes akumulateo-pulse {
    0% {
      transform: scale(0.95);
      box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7);
    }
    70% {
      transform: scale(1);
      box-shadow: 0 0 0 7px rgba(16, 185, 129, 0);
    }
    100% {
      transform: scale(0.95);
      box-shadow: 0 0 0 0 rgba(16, 185, 129, 0);
    }
  }

  .akumulateo-bar-subtext {
    font-size: 11px;
    color: #d1d5db;
    font-weight: 500;
  }

  .akumulateo-call-btn {
    flex: 1;
    max-width: 200px;
    background: linear-gradient(135deg, #eab308 0%, #ca8a04 100%);
    color: #000000 !important;
    text-decoration: none !important;
    font-weight: 800;
    font-size: 15px;
    padding: 12px 14px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    box-shadow: 0 4px 12px rgba(234, 179, 8, 0.35);
    white-space: nowrap;
    transition: transform 0.15s ease, background 0.2s ease;
  }

  .akumulateo-call-btn:active {
    transform: scale(0.97);
  }

  .akumulateo-call-btn svg {
    width: 18px;
    height: 18px;
    fill: currentColor;
    flex-shrink: 0;
  }
</style>

<div id="akumulateo-sticky-bar" role="complementary" aria-label="Szybki kontakt z pogotowiem akumulatorowym">
  <div class="akumulateo-bar-info">
    <div class="akumulateo-bar-status">
      <span class="akumulateo-pulse-dot" aria-hidden="true"></span>
      <span>Dojazd 24h/7</span>
    </div>
    <div class="akumulateo-bar-subtext">Warszawa w 20-30 min</div>
  </div>

  <a href="tel:+48696556446" class="akumulateo-call-btn" id="akumulateo-track-call" onclick="akumulateoTrackPhoneClick(event)">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M6.62 10.79a15.053 15.053 0 006.59 6.59l2.2-2.2a1 1 0 011.02-.24c1.12.37 2.33.57 3.57.57a1 1 0 011 1V20a1 1 0 01-1 1A17 17 0 013 4a1 1 0 011-1h3.5a1 1 0 011 1c0 1.25.2 2.45.57 3.57a1 1 0 01-.25 1.02l-2.2 2.2z"/>
    </svg>
    <span>696 556 446</span>
  </a>
</div>

<script>
  function akumulateoTrackPhoneClick(e) {
    try {
      // Śledzenie konwersji w Google Analytics 4
      if (typeof gtag === 'function') {
        gtag('event', 'phone_call_click', {
          event_category: 'Contact',
          event_label: '+48696556446',
          value: 100
        });

        // Wysłanie bezpośredniego zdarzenia konwersji do Google Ads
        gtag('event', 'conversion', {
          'send_to': 'AW-2761528072',
          'event_category': 'Phone Call',
          'event_label': 'Mobile Sticky Bar Click'
        });
      }

      // Wysłanie zdarzenia do Facebook Pixel / FastTony (jeśli obecny)
      if (typeof fbq === 'function') {
        fbq('track', 'Contact', { content_name: 'Phone Call Sticky Bar' });
      }
    } catch (err) {
      console.warn('Tracking error:', err);
    }
  }
</script>
